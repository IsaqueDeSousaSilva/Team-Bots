<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulador de Eletrônica 2D</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0F1218; }
      /* O canvas ocupa toda a janela (ou todo o iframe onde a página for incorporada). */
      #unity-canvas { display: block; width: 100%; height: 100%; background: #0F1218; outline: none; }
      #loading {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; color: #E8ECF4; font: 600 20px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #loading small { font-weight: 400; font-size: 14px; color: #9AA4B6; }
      #bar { width: min(360px, 70vw); height: 10px; border-radius: 5px; background: #222A37; overflow: hidden; }
      #bar-fill { width: 0; height: 100%; background: #33A06B; transition: width .2s; }
      #banner { position: absolute; left: 0; right: 0; top: 0; font: 14px system-ui, sans-serif; }
      #banner div { padding: 10px 14px; color: #111; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div>Simulador de Eletrônica 2D</div>
      <div id="bar"><div id="bar-fill"></div></div>
      <small id="loading-text">Carregando…</small>
    </div>
    <div id="banner"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function showBanner(msg, type) {
        var banner = document.querySelector("#banner");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style.background = type == "error" ? "#F26B6B" : "#F2C94C";
        banner.appendChild(div);
        if (type != "error") setTimeout(function () { banner.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Simulador de Eletrônica 2D",
        productVersion: "1.0",
        showBanner: showBanner,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-fill").style.width = (100 * progress) + "%";
          document.querySelector("#loading-text").textContent = "Carregando… " + Math.round(100 * progress) + "%";
        }).then(function (instance) {
          document.querySelector("#loading").style.display = "none";
          window.simulador = instance;
          // Garante que os atalhos de teclado (Delete, R, Ctrl+Z) cheguem ao simulador.
          canvas.focus();
          canvas.addEventListener("pointerdown", function () { canvas.focus(); });
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
