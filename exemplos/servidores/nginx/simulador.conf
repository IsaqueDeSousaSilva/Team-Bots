# Nginx — copie estes blocos para DENTRO do bloco "server { ... }" do site
# (ex.: /etc/nginx/sites-available/meusite) e rode:  sudo nginx -t && sudo systemctl reload nginx
# Se a build estiver em outra pasta, ajuste o "/simulador/Build/" das três linhas.

location ~ ^/simulador/Build/.+\.data\.unityweb$ {
    gzip off;                               # não compactar de novo
    add_header Content-Encoding gzip;       # o arquivo já é gzip
    default_type application/octet-stream;
}
location ~ ^/simulador/Build/.+\.js\.unityweb$ {
    gzip off;
    add_header Content-Encoding gzip;
    default_type application/javascript;
}
location ~ ^/simulador/Build/.+\.wasm\.unityweb$ {
    gzip off;
    add_header Content-Encoding gzip;
    default_type application/wasm;
}
